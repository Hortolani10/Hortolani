    container_name: aprendiz-2h
    entrypoint: ["sh", "-c", "mkdir -p /app/runtime/aprendiz-2h && cd /app/runtime/aprendiz-2h && exec python -m bot --config /app/config_aprendiz_2h.yaml paper"]
    environment: [PAINEL_HOST=0.0.0.0]
    ports: ["127.0.0.1:8769:8769"]
