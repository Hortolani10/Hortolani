# Uso:  docker compose up -d --build     (inicia e mantém ligado 24h)
#       docker compose logs -f           (ver o que o bot está fazendo)
# Para mudar de modo, troque "paper" por "live" em command (veja docs/VPS.md).
x-seguro: &seguro                    # mesmas travas de segurança em todos os bots
  build: .
  image: hortolani-bot
  restart: unless-stopped
  env_file: .env
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bot:
    build: .
    image: hortolani-bot
    container_name: hortolani-bot
    command: ["paper"]
    restart: unless-stopped          # reinicia sozinho se cair ou se o servidor reiniciar
    env_file: .env                   # chaves da Binance e do Telegram (nunca vão para a imagem)
    environment:
      - PAINEL_HOST=0.0.0.0          # dentro do container; fora, só o próprio servidor acessa (abaixo)
    ports:
      - "127.0.0.1:8765:8765"        # painel: acesse do seu PC com  ssh -L 8765:localhost:8765 bot@IP
    volumes:
      - ./runtime:/app/runtime       # estado, diário, logs, dados e o arquivo PAUSAR
    read_only: true                  # o resto do sistema de arquivos é só leitura
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    healthcheck:                     # "unhealthy" no docker ps se o bot parar de salvar o estado
      test: ["CMD", "python", "-c", "import glob,os,sys,time; f=glob.glob('/app/runtime/state_*.json'); sys.exit(0 if f and time.time()-max(map(os.path.getmtime,f))<600 else 1)"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 5m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- BOTS APRENDIZES (só PAPER, dinheiro fictício) ----------------
  # Operam quase todo dia em 4 tempos gráficos para coletar dados (setups + padrões de gráfico).
  # Cada um usa a sua pasta dentro de runtime/ (estado, diário e log separados).
  # Painéis: abra a Central (abrir_painel.bat) e clique no bot
  aprendiz-4h:
    <<: *seguro
    container_name: aprendiz-4h
    entrypoint: ["sh", "-c", "mkdir -p /app/runtime/aprendiz-4h && cd /app/runtime/aprendiz-4h && exec python -m bot --config /app/config_aprendiz.yaml paper"]
    environment: [PAINEL_HOST=0.0.0.0]
    ports: ["127.0.0.1:8768:8768"]
    volumes: [./runtime:/app/runtime]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import glob,os,sys,time; f=glob.glob('/app/runtime/aprendiz-4h/state_*.json'); sys.exit(0 if f and time.time()-max(map(os.path.getmtime,f))<900 else 1)"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 5m

  # Aprendizes de CARTEIRA no gráfico diário (27/11/2026, PESQUISA.md seção 27): substituem os de 2h e 1h, que perdiam
  # com qualquer forma de saída. Os dados antigos ficam em runtime/aprendiz-2h e runtime/aprendiz-1h.
  aprendiz-rotacao:
    <<: *seguro
    container_name: aprendiz-rotacao
    entrypoint: ["sh", "-c", "mkdir -p /app/runtime/aprendiz-rotacao && cd /app/runtime/aprendiz-rotacao && exec python -m bot.carteira --config /app/config_aprendiz_rotacao.yaml"]
    environment: [PAINEL_HOST=0.0.0.0]
    ports: ["127.0.0.1:8769:8769"]
    volumes: [./runtime:/app/runtime]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import glob,os,sys,time; f=glob.glob('/app/runtime/aprendiz-rotacao/state_*.json'); sys.exit(0 if f and time.time()-max(map(os.path.getmtime,f))<900 else 1)"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 5m

  aprendiz-rompimento:
    <<: *seguro
    container_name: aprendiz-rompimento
    entrypoint: ["sh", "-c", "mkdir -p /app/runtime/aprendiz-rompimento && cd /app/runtime/aprendiz-rompimento && exec python -m bot.carteira --config /app/config_aprendiz_rompimento.yaml"]
    environment: [PAINEL_HOST=0.0.0.0]
    ports: ["127.0.0.1:8770:8770"]
    volumes: [./runtime:/app/runtime]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import glob,os,sys,time; f=glob.glob('/app/runtime/aprendiz-rompimento/state_*.json'); sys.exit(0 if f and time.time()-max(map(os.path.getmtime,f))<900 else 1)"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 5m

  # Aprendiz de CAPITULAÇÃO (nov/2026): compra no dia de pânico (queda de 10%+ com RSI < 25), vende em 3 dias.
  aprendiz-capitulacao:
    <<: *seguro
    container_name: aprendiz-capitulacao
    entrypoint: ["sh", "-c", "mkdir -p /app/runtime/aprendiz-capitulacao && cd /app/runtime/aprendiz-capitulacao && exec python -m bot --config /app/config_aprendiz_capitulacao.yaml paper"]
    environment: [PAINEL_HOST=0.0.0.0]
    ports: ["127.0.0.1:8771:8771"]
    volumes: [./runtime:/app/runtime]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import glob,os,sys,time; f=glob.glob('/app/runtime/aprendiz-capitulacao/state_*.json'); sys.exit(0 if f and time.time()-max(map(os.path.getmtime,f))<900 else 1)"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 5m

  # REVISÃO MENSAL (nov/2026): todo dia 1º, 09:10 de Brasília, refaz o teste das saídas com dados novos da Binance
  # e manda o resultado no Telegram. Só informa: não muda nada nos bots. Rodar na hora:
  #   docker compose run --rm revisao --agora
  revisao:
    <<: *seguro
    container_name: hortolani-revisao
    entrypoint: ["python", "-m", "bot.revisao"]
    command: []
    volumes: [./runtime:/app/runtime]
    mem_limit: 512m

  # aprendiz-15m DESLIGADO (nov/2026): no 15 min as taxas comem o resultado, no histórico e na prática
  # (−0,68R por operação). O diário dele fica em runtime/aprendiz-15m. Para religar, ver config_aprendiz_15m.yaml.
