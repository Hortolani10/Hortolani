    healthcheck:
      test: ["CMD", "python", "-c", "import glob,os,sys,time; f=glob.glob('/app/runtime/aprendiz-2h/state_*.json'); sys.exit(0 if f and time.time()-max(map(os.path.getmtime,f))<900 else 1)"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 5m

  aprendiz-1h:
    <<: *seguro
    container_name: aprendiz-1h
    entrypoint: ["sh", "-c", "mkdir -p /app/runtime/aprendiz-1h && cd /app/runtime/aprendiz-1h && exec python -m bot --config /app/config_aprendiz_1h.yaml paper"]
    environment: [PAINEL_HOST=0.0.0.0]
    ports: ["127.0.0.1:8770:8770"]
    volumes: [./runtime:/app/runtime]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import glob,os,sys,time; f=glob.glob('/app/runtime/aprendiz-1h/state_*.json'); sys.exit(0 if f and time.time()-max(map(os.path.getmtime,f))<900 else 1)"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 5m

  aprendiz-15m:
    <<: *seguro
    container_name: aprendiz-15m
    entrypoint: ["sh", "-c", "mkdir -p /app/runtime/aprendiz-15m && cd /app/runtime/aprendiz-15m && exec python -m bot --config /app/config_aprendiz_15m.yaml paper"]
    environment: [PAINEL_HOST=0.0.0.0]
    ports: ["127.0.0.1:8771:8771"]
