<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Leitor de Pedidos – Configuração</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; min-width: 340px; color: #1f2933; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
  button { margin-top: 14px; padding: 6px 14px; }
  small { color: #52606d; }
</style>
<h3>Leitor de Pedidos</h3>
<p><small>O pedido será aberto no cadastro do Ventriculo para revisão.</small></p>
<label>Endereço do Ventriculo
  <input id="appUrl" type="url" placeholder="https://ventriculo-app.vercel.app/pedidos/cadastrar">
</label>
<label style="font-weight:400"><input id="leituraAutomatica" type="checkbox" style="width:auto"> Ler sozinho os protocolos em "Receber" ao abrir "Meus Protocolos"</label>
<label style="font-weight:400"><input id="importarEmLote" type="checkbox" style="width:auto"> "Importar todos" abre <b>uma aba só</b> com todos os pedidos (o cadastro do Ventrículo recebe a lista). Só ligue quando o Ventrículo aceitar isso.</label>
<button id="salvar">Salvar</button>
<span id="status"></span>
<script src="options.js"></script>
</html>
