# ============================================================
#  Configuração do bot  (valores conservadores por padrão)
# ============================================================

mode: paper            # backtest | paper | live
testnet: true          # true = usa testnet.binance.vision (recomendado antes do live)

# Endereço para baixar candles/preços públicos (backtest, analyze, dashboard, paper).
# O espelho oficial data-api.binance.vision funciona onde api.binance.com é bloqueado.
market_data_url: https://data-api.binance.vision/api/v3

# Moedas consolidadas (testadas em 3 anos de dados reais)
symbols:
  - BTC/USDT
  - ETH/USDT
  - BNB/USDT
  - SOL/USDT
  - XRP/USDT
  - ADA/USDT
  - LTC/USDT
  - LINK/USDT

timeframes:
  trend: 1d            # tempo gráfico maior: define a tendência (só compra a favor dela)
  entry: 4h            # tempo gráfico de entrada: define o gatilho
  # 1h/4h foi testado e perdeu para as taxas: no 1h nada superou entradas aleatórias

strategy:
  btc_filter: true     # só compra qualquer moeda se o BTC também estiver em tendência de ALTA
  ema_fast: 21
  ema_mid: 50
  ema_slow: 200
  rsi_period: 14
  rsi_min: 45          # RSI abaixo disso = momentum fraco, não entra
  rsi_max: 68          # RSI acima disso = esticado/sobrecomprado, não entra
  adx_period: 14
  adx_min: 20          # ADX abaixo disso = mercado lateral, não entra
  atr_period: 14
  volume_ma: 20
  volume_factor: 1.0   # volume do candle >= média * fator
  pullback_lookback: 5 # candles para procurar o toque/pullback na EMA rápida
  max_extension_atr: 1.5  # não compra se o preço estiver > X ATR acima da EMA rápida
  swing_lookback: 10   # candles para achar o fundo (swing low) do stop
  resistance_lookback: 50  # candles para achar a resistência (topo anterior) e medir o R:R

risk:
  risk_per_trade: 0.01      # arrisca 1% do capital por operação
  max_position_pct: 0.25    # nenhuma posição maior que 25% do capital
  max_open_positions: 2     # moedas têm correlação 0,6-0,8 com o BTC: 3 posições ≈ mesma aposta repetida
  stop_min_atr: 1.0         # distância mínima do stop (em ATR)
  stop_max_atr: 3.0         # distância máxima do stop (em ATR)
  exit_mode: trailing       # trailing | parcial | alvo   (trailing venceu no teste de 3 anos)
  trend_exit: false         # true = também sai se fechar abaixo da EMA50 / tendência virar BAIXA
  target_r: 2.0             # usado só no exit_mode "alvo"
  take_partial_r: 1.5       # usado só no exit_mode "parcial": realiza parcial em 1.5x o risco
  partial_fraction: 0.5     # % da posição vendida na parcial
  trailing_atr: 3.0         # trailing stop (chandelier): máxima desde a entrada - 3 ATR
  breakeven_after_partial: true
  adaptive_risk:            # defesa automática: reage a cada perda sem mudar a estratégia
    enabled: true
    drawdown_trigger: 0.05  # carteira 5% abaixo do pico...
    factor: 0.5             # ...arrisca metade (0,5%) até voltar ao pico
  max_daily_loss: 0.03      # para de operar no dia se perder 3%
  max_consecutive_losses: 3 # após 3 stops seguidos, pausa
  cooldown_hours: 24
  min_reward_risk: 0.0      # exige espaço até a resistência (em R). No 4h, 1.5 barrava 95% dos sinais

# Cofre "seguir a tendência": parte da carteira fica em BTC/ETH enquanto a tendência
# DIÁRIA estiver em ALTA (ETH só com o BTC também em alta); senão fica em USDT.
# Testado em 6 anos: 25% no cofre + 75% no bot, reequilibrando todo mês:
# 100 -> ~227 USDT (queda máx. 19%); só o bot: 100 -> 139 (queda 12%). Ver PESQUISA.md.
trend_sleeve:
  enabled: true
  fraction: 0.25              # 25% da carteira
  symbols: [BTC/USDT, ETH/USDT]
  rebalance_tolerance: 0.05   # reequilíbrio mensal só se o desvio passar de 5% do alvo

# Estratégia de LATERALIZAÇÃO operando de verdade (reversão à média no 4h quando o diário está LATERAL).
# Teste em 6 anos (carteira completa, 100 USDT): ~4 operações/mês em vez de ~2, acerto 43% vs 37%,
# 100 -> ~220 (vs ~226), queda máx. 22% (vs 19%). Ver PESQUISA.md seção 12.
lateral:
  enabled: true               # ligada em nov/2026 a pedido: mais operações, validar no paper
  rsi_max: 30
  stop_atr: 2.0
  max_bars: 12
  risk_scale: 1.0

# Painel ao vivo no navegador: http://localhost:8765 (só leitura, só neste computador)
painel:
  nome: Bot Hortolani        # nome que aparece no painel (troque à vontade)
  enabled: true
  port: 8765
  abrir_navegador: true      # abre o navegador sozinho quando o bot inicia

# Estratégias em OBSERVAÇÃO: o bot registra no diário o que teria acontecido, sem operar.
# Veja os resultados com: python -m bot aprender   (origem "observacao-lateral")
observacao:
  lateralizacao: true         # reversão à média quando o diário está LATERAL (PESQUISA.md, seção 10)

fees:
  min_order: 5.0            # valor mínimo de uma ordem na Binance (USDT) — conferido em nov/2026
  taker: 0.001              # 0,1% (Binance spot sem desconto BNB)
  slippage: 0.0005

live:                       # modo live (testnet ou dinheiro real)
  budget_usdt: 100          # o bot usa NO MÁXIMO isto, mesmo que a conta tenha mais (vazio = conta inteira)

paper:
  initial_balance: 100      # USDT fictício (mesmo valor que você pretende usar de verdade)

loop:
  poll_seconds: 60
