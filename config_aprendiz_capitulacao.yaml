# ============================================================
#  APRENDIZ DE CAPITULAÇÃO — só em PAPER (dinheiro fictício)
#  Compra depois de um candle de PÂNICO no 4h (a moeda caiu 5%+ em 4 horas com RSI < 20)
#  e vende 24 h depois (6 candles). Stop LARGO (4 a 6 ATR): depois do pânico o preço
#  sacode mais para baixo antes de repicar; com stop normal o efeito sumia.
#  Teste nov/2026 (16 moedas, simulador oficial, taxas):
#    6 anos 159 ops (54 dias de pânico) acerto 71% +0,18R · 2020-23 +0,15R ·
#    3 anos +0,22R · 12 meses 17 ops acerto 53% +0,14R.
#  A versão diária (queda de 10%) ganhou no último ano mas perdeu em 2020-23: descartada.
#  O stop largo deixa a posição pequena: a perda em USDT continua limitada ao risco fixo.
#  PESQUISA.md seção 17.
# ============================================================
herda: config_aprendiz.yaml
instancia: aprendiz-capitulacao

# 26 moedas (28/11/2026, PESQUISA.md seção 28): as 16 do bot principal + 10 grandes e líquidas.
# Com a mesma regra, operou ~60% mais e manteve o acerto (81-88%). Só moedas grandes: pânico em moeda pequena pode não ter volta.
symbols:
  - BTC/USDT
  - ETH/USDT
  - BNB/USDT
  - SOL/USDT
  - XRP/USDT
  - ADA/USDT
  - LTC/USDT
  - LINK/USDT
  - DOGE/USDT
  - AVAX/USDT
  - DOT/USDT
  - TRX/USDT
  - ATOM/USDT
  - UNI/USDT
  - BCH/USDT
  - XLM/USDT
  - NEAR/USDT
  - FIL/USDT
  - ETC/USDT
  - AAVE/USDT
  - HBAR/USDT
  - APT/USDT
  - ARB/USDT
  - OP/USDT
  - INJ/USDT
  - SUI/USDT

timeframes:
  trend: 1d
  entry: 4h

strategy:
  tendencia: false          # este bot não usa a estratégia de tendência, só o setup de capitulação

exploracao:
  enabled: true
  setups: [capitulacao]
  capitulacao_queda: 0.05   # queda mínima no candle de 4h (5%)
  capitulacao_rsi: 20       # RSI (4h) abaixo disso

lateral:
  enabled: false

risk:
  exit_mode: alvo
  target_r: 50              # sem alvo: sai por tempo
  max_bars: 6               # vende após 6 candles de 4h (24 h)
  trava_gatilho: 0.03       # trava de lucro (27/11/2026): em +3% o stop sobe para +3% (acerto 70% -> 91% no teste de 6 anos)
  trava_lucro: 0.03
  stop_min_atr: 4.0         # stop largo de proteção
  stop_max_atr: 6.0
  max_open_positions: 6

painel:
  nome: Bot Aprendiz Capitulação
  port: 8771
